name: Publish extensions index

# Rebuilds index.json from the latest GitHub release of every EDC product
# and publishes it (plus a landing page) to GitHub Pages at
# https://edccorp.github.io/edc-software/index.json
#
# Runs on a schedule so new product releases are picked up automatically,
# and can be run manually (Actions -> Publish extensions index -> Run
# workflow) right after cutting a release. Product repos can also trigger
# it instantly with a repository_dispatch event (type: product-release).

on:
  schedule:
    # Hourly so a new product release appears in Blender within the hour.
    # Product repos can also trigger this instantly via repository_dispatch
    # (type: product-release) — see tools/notify-extensions.md.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      allow_drop:
        description: >-
          Publish even if a product would disappear from the live index
          (only when removing a product on purpose)
        type: boolean
        default: false
  repository_dispatch:
    types: [product-release]
  push:
    branches: [main]
    # Only site-affecting changes need a Pages deploy; gateway/CLI pushes
    # deploy through Railway instead and were flooding Pages with
    # deployments (its backend then intermittently rejects them).
    paths:
      - tools/build_index.py
      - content/**
      - .github/workflows/publish.yml

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deployments instead of cancelling: a Pages deployment aborted
# mid-flight makes the backend fail the next ones with "Deployment
# failed, try again later".
concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # While the product repos are private, the default workflow token
      # cannot read their releases -- add a PRODUCTS_TOKEN secret (a
      # fine-grained PAT with Contents:read on every product repo,
      # including the hidden ones).
      # MIRROR_ZIPS=0: gateway mode. The zips are NOT copied onto the public
      # Pages site; the Railway gateway at extensions.edccorp.com serves the
      # same /packages/ URLs by streaming the private GitHub release assets
      # to authenticated customers (see gateway/README.md).
      - name: Build index.json and landing page
        env:
          GITHUB_TOKEN: ${{ secrets.PRODUCTS_TOKEN || github.token }}
          MIRROR_ZIPS: "0"
          # The build refuses to publish an index that would drop a product
          # the live one has (a dead token used to publish an empty one).
          ALLOW_DROP: ${{ inputs.allow_drop && 'true' || 'false' }}
        run: python tools/build_index.py site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
