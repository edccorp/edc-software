name = "Video Forensics Toolkit™"
tagline = "Recover What the Video Actually Recorded"
badge = "Built for Blender • Powered by FFmpeg"
price = "$399"
blender_min = "5.0"
hero_image = "video-forensics-toolkit-hero.jpg"

pitch = """The Video Forensics Toolkit™ analyses video evidence inside \
Blender, in the footage's own terms. It answers the question every \
measurement taken from video depends on first: when did each frame actually \
happen? Much CCTV, DVR and phone footage is variable-rate, or pads a nominal \
rate with duplicated frames, so assuming a constant frame rate silently \
corrupts every calculation built on it. The toolkit recovers the real timing \
from the file's own per-frame timestamps instead of trusting the container's \
headline number, then builds its integrity, synchronization, measurement and \
exhibit tools on that footing."""

features = [
    "Real frame timing from the file's own timestamps: stated, typical and average rates, gaps and dropped pictures",
    "Time Map: the true elapsed time between any two frames, with a warning when a frame is a repeated copy",
    "Duplicate-frame detection, and export of the real pictures, each stamped with its own time, with a time map",
    "Metadata, encoder signatures and SHA-256 hashing for chain of custody",
    "Timestamp OCR: reads a burned-in clock on every frame and reconciles it with the file's timestamps",
    "Integrity checks: interlacing, 3:2 telecine, resampling, macroblock grid offset after a crop, double compression",
    "Multi-camera sync: several cameras on one common time grid, with a review edit",
    "Scene cuts and lighting changes, exposure timeline, active picture, smooth-region (redaction) map, excerpt matching, per-GOP bitrate",
    "Speed from tracks by cross-ratio on the vehicle's own wheelbase, with the clip's lens taken out and real capture times",
    "Evidence and viewing exports, motion-vector, macroblock and optical-flow exhibit videos, a per-frame ledger, and a PDF/HTML forensic report",
]

includes = [
    "GPL software package for the Video Forensics Toolkit™",
    "One year of authenticated repository access for downloads",
    "Repository-delivered updates, bug fixes, improvements, and new releases during the access term",
    "Repository secret associated with the purchaser email",
    "Official documentation",
    "Continued use of already-downloaded versions after repository access expires",
]

