# HVE's download page: hve.edccorp.com (and /hve on extensions.edccorp.com).
# Rendered by tools/build_index.py (render_hve_page) with the newest PUBLISHED
# release of edccorp/hve-next; a draft release is never shown. With no
# published release the page says downloads open at release, so this file can
# be live before HVE ships.

name = "HVE Studio"
badge = "Preview"
# Shown when the newest release is a PRE-release (its badge is then the stage
# from the tag: "Alpha", "Beta").
prerelease_note = "This version is for testing and is not yet a supported release, and only testers' keys can download it. Windows asks before running it the first time: choose More info, then Run anyway. On a Mac, open the disk image, drag HVE Studio to Applications, then the first time right-click it and choose Open. Please report anything that goes wrong to Engineering Dynamics Company."
tagline = "Human · Vehicle · Environment simulation, rebuilt for today's computers."
pitch = """HVE Studio is the next major version of HVE, the physics-based simulation environment from Engineering Dynamics Company for reconstructing and simulating vehicle crashes and occupant motion. It runs the same EDC engines classic HVE runs, from the same physics source, in a new 3-D interface.

It installs beside classic HVE rather than over it, so you can run both while you move your work across."""

# Shown under "Capabilities", a check mark each.
features = [
  "SIMON 3-D vehicle simulation, with DyMESH collision and the TMeasy combined-slip tire model",
  "Occupants in SIMON that ride through the crash and meet the vehicle's interior",
  "GATB occupant and pedestrian simulation, with walking pedestrians and airbags",
  "Motorcycles: nonlinear single-track dynamics and impacts, with a separate rider",
  "EDCRASH damage-based reconstruction; EDSMAC and EDSMAC4 collision simulation",
  "EDSVS, EDVSM, EDVTS, EDVDS and EDGEN vehicle and articulated-vehicle models",
  "Real sites: search an address and pull in USGS aerial imagery and 3-D terrain",
  "Survey point clouds (LAS, LAZ, PLY, E57 and Gaussian splats), and drivable surfaces built from a scan",
  "Photorealistic images: sun shadows, night lighting with vehicle lamps, real skies and node-based materials",
  "Animated cameras, a crush heat map, and tire and impact forces and vehicle paths in the 3-D view",
  "EDR positioning, Monte Carlo analysis, Quick Case and a VIN-based Vehicle Package",
  "Opens classic HVE cases (File → Import)",
  "Graphs, report pages and timestep tables from every run",
  "Animation recording up to 1000 fps, including slow motion; glTF export and a live link to Blender",
]

# "What's coming": a paragraph, then a picture each from content/assets.
# Leave coming_intro empty and delete the [[gallery]] entries to hide it.
coming_title = "What’s coming in HVE Studio"
coming_intro = "HVE Studio is coming soon. We plan to release it well before the 2027 HVE Forum, which will be the first training on HVE Studio. Here’s a look at what’s new."

# "Get HVE Studio updates": the form posts to the gateway's /signup. Leave
# signup_intro empty to hide the section.
signup_title = "Get HVE Studio updates"
signup_intro = "Sign up to hear about HVE Studio as it’s ready. Current HVE users: tick the box, and we’ll invite you when the beta opens."
signup_note = "We use your address only for HVE Studio news, and every email has a link to leave the list."

# Shown under "Licensing". Paragraphs separated by a blank line.
licensing = """HVE is licensed per computer. Activate it once from Help → License with your EDC Software key; it refreshes itself online, and keeps working for 60 days without an internet connection. A computer that never connects can be activated with a license file from the offline page.

Each engine is licensed separately, and so is the EDC vehicle database. Your license says which you have, and HVE tells you plainly when something is not included. Opening, viewing and printing cases is never licensed, so your work stays readable."""

# Shown under "Requirements", one bullet each.
requirements = [
  "Windows 10 or 11, 64-bit",
  "macOS 11 Big Sur or later, on an Apple Silicon or Intel Mac",
  "64-bit Linux with glibc 2.38 or later (Ubuntu 24.04, Debian 13, Fedora 39 or newer), with SDL2 and OpenGL libraries installed (for example: sudo apt install libsdl2-2.0-0)",
  "A graphics card and driver with OpenGL 3.3: any Intel HD Graphics from about 2012 on, or any AMD or NVIDIA card from the last decade. Remote Desktop and some virtual machines do not provide it",
  "Any 64-bit Intel or AMD processor, or Apple Silicon; more cores make DyMESH collisions faster",
  "8 GB of memory at least; 16 GB recommended for large point clouds, detailed vehicle meshes or multi-event cases",
  "An internet connection to activate, and at least once every 60 days (or the offline page)",
]

[[faq]]
q = "Does it replace classic HVE?"
a = "Not yet. HVE Studio installs in its own folder, uses its own .hvex case format, and never takes over the .hve file type, so classic HVE keeps working beside it. Open a classic case in HVE Studio with File → Import."

[[faq]]
q = "How do I get a key?"
a = "Existing customers already have an EDC Software key. If you do not, or have lost yours, use the recovery link under Download, or contact Engineering Dynamics Company."

[[faq]]
q = "Where is the EDC vehicle database?"
a = "It is a licensed product, so it is not in the installer. Customers licensed for it receive it separately."

[[faq]]
q = "Can I check the download?"
a = "Yes. Every release lists the SHA-256 of each of its files, beside the downloads."

